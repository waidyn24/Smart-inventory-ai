services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
      POSTGRES_DB: ${POSTGRES_DB:-smart_inventory}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-inventory}:${POSTGRES_PASSWORD:-local-demo-password}@db:5432/${POSTGRES_DB:-smart_inventory}
      SESSION_SECRET: ${SESSION_SECRET:-local-development-change-this-in-production}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo2026!}
      ALLOW_DEMO_RESET: ${ALLOW_DEMO_RESET:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      - api
volumes:
  db-data:
